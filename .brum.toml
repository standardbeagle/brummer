# Basic Brummer Configuration

[mcp]
port = 7777

[ai_coder]
default_provider = "claude"
max_concurrent = 3
workspace_base_dir = "/tmp/brummer-workspace"

[[ai_coder.providers]]
name = "claude"
enabled = true

[ai_coder.providers.cli_tool]
command = "echo"
base_args = ["Mock Claude AI Coder - Real PTY connection not configured"]
working_dir = "/tmp"
environment = {}
