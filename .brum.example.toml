# Brummer Configuration Example
# Copy this file to .brum.toml and customize for your needs

[ai_coders]
# Enable AI coder functionality
enabled = true

# Maximum concurrent AI sessions
max_concurrent = 3

# Default AI provider to use
default_provider = "claude"

# AI Provider Configurations
[ai_coders.providers]

# Claude with MCP connection via settings file
[ai_coders.providers.claude]
  command = "claude"
  # Creates .claude/settings.local.json with BRUMMER_MCP_PORT environment variable (dynamic port support)

# Claude Secure with MCP connection via settings file
[ai_coders.providers.claude-secure]
  command = "claude-secure"
  # Creates .claude/settings.local.json with BRUMMER_MCP_PORT environment variable (dynamic port support)

# Gemini with YOLO mode
[ai_coders.providers.gemini]
  command = "gemini"
  extra_args = [
    "--yolo"
  ]

# Cursor with no restrictions
[ai_coders.providers.cursor]
  command = "cursor"
  extra_args = [
    "--yolo",
    "--no-timeout"
  ]

# Aider with auto-accept behavior
[ai_coders.providers.aider]
  command = "aider"
  base_args = ["--yes", "--no-auto-commits"]
  extra_args = [
    "--yolo"
  ]

# Custom CLI tool with specific arguments
[ai_coders.providers.custom-tool]
  command = "/usr/local/bin/my-ai-tool"
  base_args = ["--verbose"]
  extra_args = [
    "--dangerously-bypass-restrictions",
    "--force-allow-file-access",
    "--no-permission-prompt"
  ]

# Base AI coder settings
[ai_coders.workspace]
  template = "typescript-react"
  gitignore_rules = [
    "node_modules/*",
    "*.log",
    ".env"
  ]
  allowed_extensions = [".ts", ".tsx", ".js", ".jsx", ".json"]
  max_file_size_mb = 10

# Resource limits
[ai_coders.resource_limits]
  max_memory_mb = 2048
  max_cpu_percent = 80
  max_files_per_coder = 100