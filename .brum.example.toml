# Brummer Example Configuration File
# Copy this to .brum.toml in your project or home directory

# Package manager preferences
# preferred_package_manager = "pnpm"

# MCP (Model Context Protocol) Settings
# mcp_port = 7777
# no_mcp = false

# Network robustness (experimental)
# use_robust_networking = false

# Proxy Server Settings
# proxy_port = 19888
# proxy_mode = "reverse"
# proxy_url = ""
# standard_proxy = false
# no_proxy = false

# AI Coder Configuration
#
# Variable Replacement in CLI Arguments:
# You can use ${VAR_NAME} syntax in base_args to inject dynamic values.
# Brummer automatically provides these variables:
# - ${BRUMMER_MCP_URL}: The full MCP server URL (e.g., http://localhost:7777/mcp)
# - ${BRUMMER_MCP_PORT}: Just the port number (e.g., 7777)
# - Any environment variable from your system
#
[ai_coders]
enabled = true
max_concurrent = 3
workspace_base_dir = "~/.brummer/ai-coders"
default_provider = "claude"  # Available: claude, gemini, copilot, opencode, bash
timeout_minutes = 30
auto_cleanup = true
cleanup_after_hours = 24

# ============================================================================
# Claude CLI Tool Configuration
# ============================================================================
# Anthropic's Claude Code CLI with Brummer MCP integration
# Install: npm install -g @anthropic-ai/claude-code
# Usage: /ai claude  (default provider)
#        /ai opus    (use Opus model)
#        /ai sonnet  (use Sonnet model)
#        /ai claude-secure (with permission prompts)

[ai_coders.providers.claude]
[ai_coders.providers.claude.cli_tool]
command = "claude"
base_args = [
    "--mcp-config",
    "{\"mcpServers\":{\"brummer\":{\"type\":\"http\",\"url\":\"${BRUMMER_MCP_URL}\"}}}",
    "--dangerously-skip-permissions"  # Auto-approve MCP actions for rapid development
]
model = "sonnet"  # Default: sonnet, opus, haiku

[ai_coders.providers.claude.cli_tool.flag_mapping]
model = "--model"
output_format = "--output-format"
debug = "--debug"

# Claude Secure - Prompts for each MCP action
[ai_coders.providers.claude-secure]
[ai_coders.providers.claude-secure.cli_tool]
command = "claude"
base_args = [
    "--mcp-config",
    "{\"mcpServers\":{\"brummer\":{\"type\":\"http\",\"url\":\"${BRUMMER_MCP_URL}\"}}}"
    # No --dangerously-skip-permissions - will prompt for each action
]
model = "sonnet"

[ai_coders.providers.claude-secure.cli_tool.flag_mapping]
model = "--model"
output_format = "--output-format"
debug = "--debug"

# Claude Opus - Most capable model
[ai_coders.providers.opus]
[ai_coders.providers.opus.cli_tool]
command = "claude"
base_args = [
    "--mcp-config",
    "{\"mcpServers\":{\"brummer\":{\"type\":\"http\",\"url\":\"${BRUMMER_MCP_URL}\"}}}",
    "--model", "opus",
    "--dangerously-skip-permissions"
]
model = "opus"

[ai_coders.providers.opus.cli_tool.flag_mapping]
model = "--model"
output_format = "--output-format"
debug = "--debug"

# Claude Sonnet - Fast and smart
[ai_coders.providers.sonnet]
[ai_coders.providers.sonnet.cli_tool]
command = "claude"
base_args = [
    "--mcp-config",
    "{\"mcpServers\":{\"brummer\":{\"type\":\"http\",\"url\":\"${BRUMMER_MCP_URL}\"}}}",
    "--model", "sonnet",
    "--dangerously-skip-permissions"
]
model = "sonnet"

[ai_coders.providers.sonnet.cli_tool.flag_mapping]
model = "--model"
output_format = "--output-format"
debug = "--debug"

# ============================================================================
# Gemini CLI Tool Configuration
# ============================================================================
# Google's Gemini with Brummer MCP integration (if CLI supports MCP)
# Install: Follow Google AI Studio instructions
# Usage: /ai gemini

[ai_coders.providers.gemini]
[ai_coders.providers.gemini.cli_tool]
command = "gemini"
base_args = [
    # NOTE: Update these args if Gemini CLI adds MCP support
    # "--mcp-server", "${BRUMMER_MCP_URL}"
]

[ai_coders.providers.gemini.cli_tool.flag_mapping]
model = "--model"
prompt = "--prompt"
debug = "--debug"

[ai_coders.providers.gemini.cli_tool.environment]
# Gemini uses GEMINI_API_KEY from environment

# ============================================================================
# GitHub Copilot CLI Configuration
# ============================================================================
# GitHub Copilot in the CLI with Brummer MCP integration
# Install: gh extension install github/gh-copilot
# Usage: /ai copilot

[ai_coders.providers.copilot]
[ai_coders.providers.copilot.cli_tool]
command = "gh"
base_args = [
    "copilot",
    "chat"
    # NOTE: Add MCP config when Copilot CLI supports it
    # Current Copilot CLI may not support MCP servers yet
]

[ai_coders.providers.copilot.cli_tool.flag_mapping]
# Copilot CLI uses different flag patterns
# Update as Copilot CLI evolves

[ai_coders.providers.copilot.cli_tool.environment]
# GitHub Copilot uses gh CLI authentication

# ============================================================================
# OpenCode CLI Tool Configuration
# ============================================================================
# OpenCode with Brummer MCP integration
# Install: npm install -g opencode-cli (or appropriate install method)
# Usage: /ai opencode

[ai_coders.providers.opencode]
[ai_coders.providers.opencode.cli_tool]
command = "opencode"
base_args = [
    "run"
    # NOTE: Add MCP config args if OpenCode supports MCP
    # "--mcp-url", "${BRUMMER_MCP_URL}"
]

[ai_coders.providers.opencode.cli_tool.flag_mapping]
model = "--model"
prompt = "--prompt"
debug = "--log-level"

[ai_coders.providers.opencode.cli_tool.environment]
# OpenCode uses API keys from its own config

# ============================================================================
# Bash Shell Provider
# ============================================================================
# Direct bash shell for manual command execution and scripting
# Usage: /ai bash

[ai_coders.providers.bash]
[ai_coders.providers.bash.cli_tool]
command = "bash"
base_args = [
    "-i"  # Interactive mode
]
working_dir = "."

# Alternative shells available
[ai_coders.providers.zsh]
[ai_coders.providers.zsh.cli_tool]
command = "zsh"
base_args = ["-i"]
working_dir = "."

[ai_coders.providers.fish]
[ai_coders.providers.fish.cli_tool]
command = "fish"
base_args = ["-i"]
working_dir = "."

# ============================================================================
# Additional Providers
# ============================================================================

# Aider - AI pair programming tool
[ai_coders.providers.aider]
[ai_coders.providers.aider.cli_tool]
command = "aider"
base_args = ["--yes"]  # Auto-confirm changes
working_dir = "."

[ai_coders.providers.aider.cli_tool.flag_mapping]
model = "--model"
message = "--message"

[ai_coders.providers.aider.cli_tool.environment]
# OPENAI_API_KEY from environment

# Local Model Provider (Ollama)
[ai_coders.providers.local]
base_url = "http://localhost:11434"
model = "codellama"
max_tokens = 2048
temperature = 0.7
request_timeout_seconds = 60

# Resource Limits
[ai_coders.resource_limits]
max_memory_mb = 512
max_disk_space_mb = 1024
max_cpu_percent = 50
max_processes = 5
max_files_per_coder = 100

# Workspace Settings
[ai_coders.workspace]
template = "basic"
gitignore_rules = ["node_modules/", ".env", "*.log", "dist/", "build/"]
allowed_extensions = [".go", ".js", ".ts", ".py", ".md", ".json", ".yaml", ".toml", ".txt", ".sh"]
forbidden_paths = ["/etc", "/var", "/sys", "/proc"]
max_file_size_mb = 10
backup_enabled = true

# AI Coder Logging
[ai_coders.logging]
level = "info"
output_file = "ai-coders.log"
rotate_size_mb = 50
keep_rotations = 5
include_ai_output = false